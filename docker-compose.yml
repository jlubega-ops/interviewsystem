name: interviewsystem

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: interviewsystem
      MYSQL_USER: eiic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - eiic_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - eiic

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://eiicinterviews.mubs.ac.ug}
        JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: mysql://eiic:${MYSQL_PASSWORD}@db:3306/interviewsystem
    ports:
      - "127.0.0.1:3060:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eiic

volumes:
  eiic_mysql:

networks:
  eiic:
    name: interviewsystem
